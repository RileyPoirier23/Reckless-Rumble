name: DriveBoss build

# Runs the driving-sim and counter tests, then exports Windows, Linux and macOS builds of the prototype
# (Actions tab -> the run -> Artifacts).
on:
  workflow_dispatch:
  push:
    paths: ['game/**', '.github/workflows/driveboss.yml']

concurrency:
  group: driveboss-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot and export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$HOME/godot"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j tpl.tpz 'templates/version.txt' 'templates/linux_release.x86_64' 'templates/windows_release_x86_64.exe' 'templates/macos.zip' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm tpl.tpz
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"
      - name: Import
        working-directory: game
        run: timeout 300 "$GODOT" --headless --path . --import || true
      - name: Driving sim tests
        working-directory: game
        run: |
          "$GODOT" --headless --path . -s tests/run_tests.gd | tee test.log
          grep -q "^0 failed" test.log
      - name: Map, sky and car tests
        working-directory: game
        run: |
          "$GODOT" --headless --path . -s tests/world_tests.gd | tee world.log
          grep -q "^0 failed" world.log
      - name: Traffic soak test
        working-directory: game
        run: |
          timeout 900 "$GODOT" --headless --path . -- --traffic-test | tee traffic.log
          grep -q "^0 failed" traffic.log
      - name: Counter tests
        working-directory: game
        run: |
          "$GODOT" --headless --path . -s tests/counter_tests.gd | tee counter.log
          grep -q "^0 failed" counter.log
      - name: Parts tests
        working-directory: game
        run: |
          "$GODOT" --headless --path . -s tests/parts_tests.gd | tee parts.log
          grep -q "^0 failed" parts.log
      - name: Physics tests
        working-directory: game
        run: |
          "$GODOT" --headless --path . -s tests/physics_tests.gd | tee physics.log
          grep -q "^0 failed" physics.log
      - name: Catalog tests
        working-directory: game
        run: |
          "$GODOT" --headless --path . -s tests/catalog_tests.gd | tee catalog.log
          grep -q "^0 failed" catalog.log
      - name: Story tests
        working-directory: game
        run: |
          "$GODOT" --headless --path . -s tests/story_tests.gd | tee story.log
          grep -q "^0 failed" story.log
      - name: Export
        working-directory: game
        run: |
          mkdir -p build/windows build/linux build/macos
          "$GODOT" --headless --path . --export-release "Windows" build/windows/DriveBoss.exe
          "$GODOT" --headless --path . --export-release "Linux" build/linux/driveboss.x86_64
          "$GODOT" --headless --path . --export-release "macOS" build/macos/DriveBoss.zip
          ls -la build/*
      - uses: actions/upload-artifact@v4
        with:
          name: driveboss-windows
          path: game/build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: driveboss-linux
          path: game/build/linux
      - uses: actions/upload-artifact@v4
        with:
          name: driveboss-macos
          path: game/build/macos
